auth_enabled: false
server: {http_listen_port: 3100, grpc_server_max_recv_msg_size: 67108864, grpc_server_max_send_msg_size: 67108864, log_level: warn}
common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage: {filesystem: {chunks_directory: /tmp/loki/chunks, rules_directory: /tmp/loki/rules}}
  replication_factor: 1
  ring: {kvstore: {store: inmemory}}
schema_config:
  configs:
    - {from: 2024-01-01, store: tsdb, object_store: filesystem, schema: v13, index: {prefix: index_, period: 24h}}
# No result cache: ClickHouse's query cache is off by default too. Chunk cache stays on.
query_range: {cache_results: false}
limits_config:
  allow_structured_metadata: true
  ingestion_rate_mb: 256
  ingestion_burst_size_mb: 512
  per_stream_rate_limit: 128MB
  per_stream_rate_limit_burst: 256MB
  max_entries_limit_per_query: 100000
  max_query_series: 10000
  reject_old_samples: false
analytics: {reporting_enabled: false}
