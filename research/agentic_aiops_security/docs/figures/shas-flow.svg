<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">SHAS consolidated flow</title>
  <desc id="desc">One flow from the user prompt through planning, publication, execution, and the Recorder. The gateway refuses a tool sequence that is not a path in the published control-flow graph, and it verifies a transaction token that names the principal. Guardrails, Cedar, and Progent stop work that leaves the duty or the profile. A cold start or an anomalous call stays in the sandbox until reconcile. Only an admitted report becomes the next brief.</desc>
  <rect width="1500" height="1120" fill="#f7f6f3"/>
  <text x="40" y="42" fill="#1c1917" font-size="26" font-weight="700">Consolidated flow</text>
  <text x="40" y="68" fill="#57534e" font-size="15">The request is minted, the call is gated, and only an admitted report becomes the next brief.</text>

  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 Z" fill="#44403c"/>
    </marker>
    <marker id="flow-arrow-brown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 Z" fill="#7c4a12"/>
    </marker>
    <marker id="flow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 Z" fill="#1f4d3a"/>
    </marker>
    <marker id="flow-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 Z" fill="#7f1d1d"/>
    </marker>
  </defs>

  <!-- PLAN -->
  <rect x="24" y="92" width="1452" height="168" rx="12" fill="#eef2f6"/>
  <text x="40" y="114" fill="#1e3a5f" font-size="12" font-weight="700">1  PLAN</text>

  <g>
    <rect x="47" y="128" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="47" y="128" width="6" height="112" fill="#1e3a5f"/>
    <text x="65" y="154" fill="#1c1917" font-size="14" font-weight="700">User prompt</text>
    <text x="65" y="178" fill="#44403c" font-size="12">The request that starts</text>
    <text x="65" y="196" fill="#44403c" font-size="12">the task.</text>
  </g>
  <line x1="263" y1="184" x2="283" y2="184" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="285" y="128" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="285" y="128" width="6" height="112" fill="#1e3a5f"/>
    <text x="303" y="154" fill="#1c1917" font-size="14" font-weight="700">Input guardrails</text>
    <text x="303" y="178" fill="#44403c" font-size="12">Screened against the duty.</text>
    <text x="303" y="196" fill="#44403c" font-size="12">Leaving the duty stops here.</text>
  </g>
  <line x1="501" y1="184" x2="521" y2="184" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="523" y="128" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="523" y="128" width="6" height="112" fill="#1f4d3a"/>
    <text x="541" y="154" fill="#1c1917" font-size="14" font-weight="700">Discovery memory</text>
    <text x="541" y="178" fill="#44403c" font-size="12">Read-only pollers. Reports</text>
    <text x="541" y="196" fill="#44403c" font-size="12">stay out of workload memory.</text>
  </g>
  <line x1="739" y1="184" x2="759" y2="184" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="761" y="128" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="761" y="128" width="6" height="112" fill="#1f4d3a"/>
    <text x="779" y="154" fill="#1c1917" font-size="14" font-weight="700">Orchestrator</text>
    <text x="779" y="178" fill="#44403c" font-size="12">Granular plan from the request</text>
    <text x="779" y="196" fill="#44403c" font-size="12">and from discovery memory.</text>
  </g>
  <line x1="977" y1="184" x2="997" y2="184" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="999" y="128" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="999" y="128" width="6" height="112" fill="#1f4d3a"/>
    <text x="1017" y="154" fill="#1c1917" font-size="14" font-weight="700">Asago</text>
    <text x="1017" y="178" fill="#44403c" font-size="12">Revises the plan until it</text>
    <text x="1017" y="196" fill="#44403c" font-size="12">passes or the turn limit.</text>
  </g>
  <line x1="1215" y1="184" x2="1235" y2="184" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="1237" y="128" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="1237" y="128" width="6" height="112" fill="#1e3a5f"/>
    <text x="1255" y="154" fill="#1c1917" font-size="14" font-weight="700">Output guardrails</text>
    <text x="1255" y="178" fill="#44403c" font-size="12">The plan is screened.</text>
    <text x="1255" y="196" fill="#44403c" font-size="12">Leaving the duty stops here.</text>
  </g>
  <line x1="1345" y1="240" x2="1345" y2="300" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <!-- PUBLISH. The arrows point left. -->
  <rect x="24" y="268" width="1452" height="176" rx="12" fill="#faf6f1"/>
  <text x="40" y="290" fill="#7c4a12" font-size="12" font-weight="700">2  PUBLISH</text>

  <g>
    <rect x="47" y="304" width="216" height="120" rx="8" fill="#fffaf3" stroke="#7c4a12" stroke-dasharray="5 4"/>
    <text x="63" y="330" fill="#7c4a12" font-size="13" font-weight="700">Zanzibar</text>
    <text x="63" y="352" fill="#44403c" font-size="12">Helper reuse only.</text>
    <text x="63" y="370" fill="#44403c" font-size="12">Equal or reduced scope</text>
    <text x="63" y="388" fill="#44403c" font-size="12">between published profiles.</text>
    <text x="63" y="408" fill="#7c4a12" font-size="12" font-weight="700">Sits beside this chain.</text>
  </g>

  <g>
    <rect x="285" y="308" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="285" y="308" width="6" height="112" fill="#7f1d1d"/>
    <text x="303" y="334" fill="#1c1917" font-size="14" font-weight="700">SPIRE token gate</text>
    <text x="303" y="358" fill="#44403c" font-size="12">A token is issued only when</text>
    <text x="303" y="376" fill="#44403c" font-size="12">the countdown outlasts it</text>
    <text x="303" y="394" fill="#44403c" font-size="12">and a list resets it first.</text>
  </g>
  <line x1="523" y1="364" x2="503" y2="364" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="523" y="308" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="523" y="308" width="6" height="112" fill="#7f1d1d"/>
    <text x="541" y="334" fill="#1c1917" font-size="14" font-weight="700">Bellman</text>
    <text x="541" y="358" fill="#44403c" font-size="12">Signed list and countdown.</text>
    <text x="541" y="376" fill="#44403c" font-size="12">A revocation forces</text>
    <text x="541" y="394" fill="#44403c" font-size="12">a publication.</text>
  </g>
  <line x1="761" y1="364" x2="741" y2="364" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="761" y="308" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="761" y="308" width="6" height="112" fill="#7f1d1d"/>
    <text x="779" y="334" fill="#1c1917" font-size="14" font-weight="700">Check value</text>
    <text x="779" y="356" fill="#44403c" font-size="12">Binds the prompt and the</text>
    <text x="779" y="372" fill="#44403c" font-size="12">long-lived capability token.</text>
    <text x="779" y="388" fill="#44403c" font-size="12">Best-guess text stays</text>
    <text x="779" y="404" fill="#44403c" font-size="12">off that hash.</text>
  </g>
  <line x1="999" y1="364" x2="979" y2="364" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="999" y="308" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="999" y="308" width="6" height="112" fill="#7c4a12"/>
    <text x="1017" y="334" fill="#1c1917" font-size="14" font-weight="700">Cedar</text>
    <text x="1017" y="358" fill="#44403c" font-size="12">Permits publication.</text>
    <text x="1017" y="376" fill="#44403c" font-size="12">Two trust boundaries</text>
    <text x="1017" y="394" fill="#44403c" font-size="12">receive no permit.</text>
  </g>
  <line x1="1237" y1="364" x2="1217" y2="364" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="1237" y="308" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="1237" y="308" width="6" height="112" fill="#7c4a12"/>
    <text x="1255" y="334" fill="#1c1917" font-size="14" font-weight="700">Dispatcher</text>
    <text x="1255" y="358" fill="#44403c" font-size="12">Prefers single-job agents.</text>
    <text x="1255" y="376" fill="#44403c" font-size="12">A new mint stops at</text>
    <text x="1255" y="394" fill="#44403c" font-size="12">one trust boundary.</text>
  </g>

  <line x1="393" y1="420" x2="393" y2="492" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <!-- EXECUTE -->
  <rect x="24" y="460" width="1452" height="300" rx="12" fill="#f3f6f3"/>
  <text x="40" y="482" fill="#1f4d3a" font-size="12" font-weight="700">3  EXECUTE</text>

  <g>
    <rect x="285" y="500" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="285" y="500" width="6" height="112" fill="#1e3a5f"/>
    <text x="303" y="522" fill="#1c1917" font-size="14" font-weight="700">Gateway</text>
    <text x="303" y="542" fill="#44403c" font-size="12">Prompt hash and published</text>
    <text x="303" y="558" fill="#44403c" font-size="12">path. A transaction token</text>
    <text x="303" y="574" fill="#44403c" font-size="12">names the principal.</text>
    <text x="303" y="590" fill="#44403c" font-size="12">A missing edge is refused.</text>
  </g>
  <line x1="501" y1="556" x2="521" y2="556" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="523" y="500" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="523" y="500" width="6" height="112" fill="#1f4d3a"/>
    <text x="541" y="526" fill="#1c1917" font-size="14" font-weight="700">Progent</text>
    <text x="541" y="550" fill="#44403c" font-size="12">A forbidden call, arguments</text>
    <text x="541" y="568" fill="#44403c" font-size="12">included, is blocked</text>
    <text x="541" y="586" fill="#44403c" font-size="12">before it runs.</text>
  </g>
  <line x1="739" y1="556" x2="759" y2="556" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <g>
    <rect x="761" y="500" width="216" height="112" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="761" y="500" width="6" height="112" fill="#1f4d3a"/>
    <text x="779" y="526" fill="#1c1917" font-size="14" font-weight="700">In-baseline work</text>
    <text x="779" y="550" fill="#44403c" font-size="12">A permitted call inside</text>
    <text x="779" y="568" fill="#44403c" font-size="12">the local reputation</text>
    <text x="779" y="586" fill="#44403c" font-size="12">baseline reaches the resource.</text>
  </g>

  <path d="M977 556 H1130 V812" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="990" y="534" fill="#57534e" font-size="11">report</text>

  <line x1="631" y1="612" x2="631" y2="640" stroke="#7c4a12" stroke-width="1.5" marker-end="url(#flow-arrow-brown)"/>
  <text x="640" y="632" fill="#7c4a12" font-size="11">cold start or anomalous</text>

  <g>
    <rect x="523" y="644" width="216" height="88" rx="8" fill="#ffffff" stroke="#7c4a12"/>
    <text x="539" y="676" fill="#1c1917" font-size="14" font-weight="700">Task sandbox</text>
    <text x="539" y="698" fill="#44403c" font-size="12">Local CRDT shards.</text>
  </g>
  <line x1="739" y1="688" x2="759" y2="688" stroke="#7c4a12" stroke-width="1.5" marker-end="url(#flow-arrow-brown)"/>

  <g>
    <rect x="761" y="644" width="280" height="100" rx="8" fill="#ffffff" stroke="#7c4a12"/>
    <text x="777" y="668" fill="#1c1917" font-size="14" font-weight="700">Reconcile</text>
    <text x="777" y="688" fill="#44403c" font-size="12">Dry run and in-toto layout,</text>
    <text x="777" y="706" fill="#44403c" font-size="12">then the primary database.</text>
    <text x="777" y="726" fill="#7c4a12" font-size="12">Keepalive until then.</text>
  </g>
  <path d="M1041 694 H1130" fill="none" stroke="#7c4a12" stroke-width="1.5"/>

  <!-- RECORD -->
  <rect x="24" y="776" width="1452" height="312" rx="12" fill="#f8f1f1"/>
  <text x="40" y="798" fill="#7f1d1d" font-size="12" font-weight="700">4  RECORD</text>

  <g>
    <rect x="990" y="816" width="440" height="150" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <rect x="990" y="816" width="6" height="150" fill="#7f1d1d"/>
    <text x="1010" y="844" fill="#1c1917" font-size="15" font-weight="700">Recorder</text>
    <text x="1010" y="870" fill="#44403c" font-size="13">Drift and adherence. Sanitization.</text>
    <text x="1010" y="890" fill="#44403c" font-size="13">Direct-injection check. Chain audit.</text>
    <text x="1010" y="918" fill="#57534e" font-size="13">After the report is filed, context,</text>
    <text x="1010" y="938" fill="#57534e" font-size="13">tools, cache, memory, and indices are wiped.</text>
  </g>

  <g>
    <rect x="47" y="816" width="430" height="68" rx="8" fill="#ffffff" stroke="#1f4d3a"/>
    <text x="63" y="844" fill="#1f4d3a" font-size="14" font-weight="700">Admitted</text>
    <text x="63" y="864" fill="#44403c" font-size="12">The report is the next brief.</text>
  </g>
  <path d="M990 850 H490" fill="none" stroke="#1f4d3a" stroke-width="1.5" marker-end="url(#flow-arrow-green)"/>
  <text x="700" y="842" fill="#1f4d3a" font-size="11">safe</text>

  <g>
    <rect x="47" y="898" width="430" height="68" rx="8" fill="#ffffff" stroke="#7f1d1d"/>
    <text x="63" y="926" fill="#7f1d1d" font-size="14" font-weight="700">Quarantined</text>
    <text x="63" y="946" fill="#44403c" font-size="12">A dangerous chain is stopped and isolated.</text>
  </g>
  <path d="M990 932 H490" fill="none" stroke="#7f1d1d" stroke-width="1.5" marker-end="url(#flow-arrow-red)"/>
  <text x="700" y="924" fill="#7f1d1d" font-size="11">dangerous</text>

  <g>
    <rect x="47" y="982" width="1383" height="82" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="67" y="1012" fill="#1c1917" font-size="14" font-weight="700">If the report failed: bonded redo</text>
    <text x="67" y="1036" fill="#44403c" font-size="13">Read-only, one-shot, hashed before dispatch, and sent only to the nodes that produced the failure.</text>
    <text x="67" y="1056" fill="#44403c" font-size="13">The same fault is kept for forensics. If the work cannot continue without it, the workflow fails.</text>
  </g>
</svg>
