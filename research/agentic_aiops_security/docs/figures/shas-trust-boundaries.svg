<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">SHAS trust boundaries</title>
  <desc id="desc">Four trust boundaries from the core network to the internet. Trust, governance, and traceability fall at each step outward. A fetch at the internet boundary and a write in the core are different profiles.</desc>
  <rect width="1200" height="640" fill="#f7f6f3"/>
  <text x="40" y="48" fill="#1c1917" font-size="26" font-weight="700">Trust boundaries</text>
  <text x="40" y="78" fill="#57534e" font-size="15">Trust, governance, and traceability fall at each step outward.</text>

  <g>
    <rect x="40" y="108" width="260" height="400" rx="10" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="40" y="108" width="260" height="78" rx="10" fill="#1e3a5f"/>
    <rect x="40" y="156" width="260" height="30" fill="#1e3a5f"/>
    <text x="56" y="142" fill="#ffffff" font-size="18" font-weight="700">Core</text>
    <text x="56" y="166" fill="#dbe7f5" font-size="13">Local corporate LAN</text>
    <text x="56" y="220" fill="#78716c" font-size="12">TRUST</text>
    <text x="56" y="242" fill="#1c1917" font-size="16" font-weight="650">Full</text>
    <text x="56" y="276" fill="#78716c" font-size="12">RISK</text>
    <text x="56" y="298" fill="#1c1917" font-size="16">Negligible</text>
    <text x="56" y="332" fill="#78716c" font-size="12">GOVERNANCE</text>
    <text x="56" y="354" fill="#1c1917" font-size="16">Complete</text>
    <text x="56" y="388" fill="#78716c" font-size="12">TRACEABILITY</text>
    <text x="56" y="410" fill="#1c1917" font-size="16">Total</text>
    <line x1="56" y1="436" x2="284" y2="436" stroke="#e7e5e4"/>
    <text x="56" y="462" fill="#1e3a5f" font-size="13" font-weight="700">Own profile</text>
    <text x="56" y="484" fill="#44403c" font-size="13">A core write is minted</text>
    <text x="56" y="502" fill="#44403c" font-size="13">on its own.</text>
  </g>

  <g>
    <rect x="328" y="108" width="260" height="400" rx="10" fill="#ffffff" stroke="#1f4d3a" stroke-width="1.5"/>
    <rect x="328" y="108" width="260" height="78" rx="10" fill="#1f4d3a"/>
    <rect x="328" y="156" width="260" height="30" fill="#1f4d3a"/>
    <text x="344" y="142" fill="#ffffff" font-size="18" font-weight="700">Intranet</text>
    <text x="344" y="166" fill="#d7efe4" font-size="13">Multi-site boundary</text>
    <text x="344" y="220" fill="#78716c" font-size="12">TRUST</text>
    <text x="344" y="242" fill="#1c1917" font-size="16">High</text>
    <text x="344" y="276" fill="#78716c" font-size="12">RISK</text>
    <text x="344" y="298" fill="#1c1917" font-size="16">Low</text>
    <text x="344" y="332" fill="#78716c" font-size="12">GOVERNANCE</text>
    <text x="344" y="354" fill="#1c1917" font-size="16">High</text>
    <text x="344" y="388" fill="#78716c" font-size="12">TRACEABILITY</text>
    <text x="344" y="410" fill="#1c1917" font-size="16">High</text>
    <line x1="344" y1="436" x2="572" y2="436" stroke="#e7e5e4"/>
    <text x="344" y="462" fill="#1f4d3a" font-size="13" font-weight="700">Own boundary</text>
    <text x="344" y="484" fill="#44403c" font-size="13">Between the core and</text>
    <text x="344" y="502" fill="#44403c" font-size="13">the vendor networks.</text>
  </g>

  <g>
    <rect x="616" y="108" width="260" height="400" rx="10" fill="#ffffff" stroke="#7c4a12" stroke-width="1.5"/>
    <rect x="616" y="108" width="260" height="78" rx="10" fill="#7c4a12"/>
    <rect x="616" y="156" width="260" height="30" fill="#7c4a12"/>
    <text x="632" y="142" fill="#ffffff" font-size="18" font-weight="700">Federated</text>
    <text x="632" y="166" fill="#f6e7d4" font-size="13">Vendor networks</text>
    <text x="632" y="220" fill="#78716c" font-size="12">TRUST</text>
    <text x="632" y="242" fill="#1c1917" font-size="16">Moderate</text>
    <text x="632" y="276" fill="#78716c" font-size="12">RISK</text>
    <text x="632" y="298" fill="#1c1917" font-size="16">Moderate</text>
    <text x="632" y="332" fill="#78716c" font-size="12">GOVERNANCE</text>
    <text x="632" y="354" fill="#1c1917" font-size="16">Limited</text>
    <text x="632" y="388" fill="#78716c" font-size="12">TRACEABILITY</text>
    <text x="632" y="410" fill="#1c1917" font-size="16">Low</text>
    <line x1="632" y1="436" x2="860" y2="436" stroke="#e7e5e4"/>
    <text x="632" y="462" fill="#7c4a12" font-size="13" font-weight="700">Own boundary</text>
    <text x="632" y="484" fill="#44403c" font-size="13">Vendor networks, between</text>
    <text x="632" y="502" fill="#44403c" font-size="13">the intranet and the internet.</text>
  </g>

  <g>
    <rect x="904" y="108" width="256" height="400" rx="10" fill="#ffffff" stroke="#7f1d1d" stroke-width="1.5"/>
    <rect x="904" y="108" width="256" height="78" rx="10" fill="#7f1d1d"/>
    <rect x="904" y="156" width="256" height="30" fill="#7f1d1d"/>
    <text x="920" y="142" fill="#ffffff" font-size="18" font-weight="700">Internet</text>
    <text x="920" y="166" fill="#f8d4d4" font-size="13">No organizational trust</text>
    <text x="920" y="220" fill="#78716c" font-size="12">TRUST</text>
    <text x="920" y="242" fill="#1c1917" font-size="16">None</text>
    <text x="920" y="276" fill="#78716c" font-size="12">RISK</text>
    <text x="920" y="298" fill="#1c1917" font-size="16">High</text>
    <text x="920" y="332" fill="#78716c" font-size="12">GOVERNANCE</text>
    <text x="920" y="354" fill="#1c1917" font-size="16">None</text>
    <text x="920" y="388" fill="#78716c" font-size="12">TRACEABILITY</text>
    <text x="920" y="410" fill="#1c1917" font-size="16">None</text>
    <line x1="920" y1="436" x2="1140" y2="436" stroke="#e7e5e4"/>
    <text x="920" y="462" fill="#7f1d1d" font-size="13" font-weight="700">Own profile</text>
    <text x="920" y="484" fill="#44403c" font-size="13">An internet fetch is</text>
    <text x="920" y="502" fill="#44403c" font-size="13">minted on its own.</text>
  </g>

  <path d="M292 308 H316" stroke="#a8a29e" stroke-width="1.5" fill="none"/>
  <path d="M580 308 H604" stroke="#a8a29e" stroke-width="1.5" fill="none"/>
  <path d="M868 308 H892" stroke="#a8a29e" stroke-width="1.5" fill="none"/>
  <path d="M308 302 L318 308 L308 314" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <path d="M596 302 L606 308 L596 314" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <path d="M884 302 L894 308 L884 314" fill="none" stroke="#a8a29e" stroke-width="1.5"/>

  <rect x="40" y="532" width="1120" height="72" rx="10" fill="#1c1917"/>
  <text x="60" y="562" fill="#fafaf9" font-size="15" font-weight="700">Grain rule</text>
  <text x="60" y="584" fill="#e7e5e4" font-size="14">A fetch at the internet boundary and a write in the core are different profiles. One agent is not given both.</text>
</svg>
