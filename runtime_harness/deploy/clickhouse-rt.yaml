apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-rt
  namespace: agentic-aiops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse-rt
  namespace: agentic-aiops
  labels: {app: clickhouse-rt}
spec:
  replicas: 1
  selector: {matchLabels: {app: clickhouse-rt}}
  template:
    metadata:
      labels: {app: clickhouse-rt}
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:24.3
        ports:
        - {name: native, containerPort: 9000}
        - {name: http, containerPort: 8123}
        env:
        - {name: CLICKHOUSE_DB, value: otel}
        - {name: CLICKHOUSE_USER, value: default}
        - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
        resources:
          requests: {cpu: 100m, memory: 1Gi}
          limits: {cpu: "1", memory: 4Gi, ephemeral-storage: 2Gi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/clickhouse}
        - {name: config-d, mountPath: /etc/clickhouse-server/config.d/99-otel-k8s-memory.xml, readOnly: true, subPath: 99-otel-k8s-memory.xml}
        readinessProbe:
          httpGet: {path: /ping, port: http}
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: clickhouse-rt}
      - name: config-d
        configMap: {name: clickhouse-otel-config}
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-rt
  namespace: agentic-aiops
spec:
  selector: {app: clickhouse-rt}
  ports:
  - {name: native, port: 9000}
  - {name: http, port: 8123}
