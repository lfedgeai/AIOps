---
# Image-rebuild remediation: rebuild a service's container image from source
# and redeploy it (IMAGE_REBUILD mode). The model only names the service;
# the harness sanitizes it and runs this reviewed playbook. Build goes to the
# OpenShift internal registry; the deployment is rolled onto the new image.
- name: Rebuild and redeploy a service image
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl_cmd: "oc"
    namespace: "otel-demo"
    target: "cart"
    git_url: "https://github.com/open-telemetry/opentelemetry-demo.git"
    git_ref: "main"
    build_timeout: 900
    build_name: "{{ target }}-rt-rebuild"
    image_stream: "{{ namespace }}/{{ build_name }}:latest"
    registry: "image-registry.openshift-image-registry.svc:5000"
  tasks:
    - name: Apply the ImageStream + BuildConfig (idempotent)
      ansible.builtin.command: >
        {{ kubectl_cmd }} apply -f - -n {{ namespace }}
      args:
        stdin: |
          apiVersion: image.openshift.io/v1
          kind: ImageStream
          metadata:
            name: {{ build_name }}
            labels:
              app.kubernetes.io/part-of: agentic-aiops
              aiops-rt/rebuild: "true"
          spec:
            lookupPolicy:
              local: true
          ---
          apiVersion: build.openshift.io/v1
          kind: BuildConfig
          metadata:
            name: {{ build_name }}
            labels:
              app.kubernetes.io/part-of: agentic-aiops
              aiops-rt/rebuild: "true"
          spec:
            runPolicy: Serial
            source:
              type: Git
              git:
                uri: {{ git_url }}
                ref: {{ git_ref }}
              # otel-demo Dockerfiles COPY ./src/<service>/... paths, so the
              # build context must be the REPO ROOT with an explicit dockerfile
              # path — not contextDir: src/<service>.
              contextDir: "."
            strategy:
              type: Docker
              dockerStrategy:
                dockerfilePath: src/{{ target }}/Dockerfile
                forcePull: true
            output:
              to:
                kind: ImageStreamTag
                name: {{ build_name }}:latest
      register: bc_out
      changed_when: "'configured' in (bc_out.stdout or '')"

    - name: Start the build and wait for it to complete
      ansible.builtin.command: >
        {{ kubectl_cmd }} start-build {{ build_name }}
        -n {{ namespace }} --wait
      register: build_out
      changed_when: build_out.rc == 0
      failed_when: build_out.rc != 0
      # Bounded by run_playbook(timeout_s) — oc start-build has no --timeout flag.

    - name: Point the deployment at the rebuilt image
      ansible.builtin.command: >
        {{ kubectl_cmd }} set image deployment/{{ target }}
        {{ target }}={{ registry }}/{{ image_stream }}
        -n {{ namespace }}
      register: setimg_out
      changed_when: setimg_out.rc == 0

    - name: Wait for the rollout of the new image
      ansible.builtin.command: >
        {{ kubectl_cmd }} rollout status deployment/{{ target }}
        -n {{ namespace }} --timeout=240s
      register: rollout_out
      changed_when: false
