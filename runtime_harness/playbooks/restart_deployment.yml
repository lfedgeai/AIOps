---
# Governed remediation: rollout-restart a deployment (e.g. after kill_pod
# churn or a stuck rollout).
- name: Rollout-restart a deployment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl_cmd: "{{ kubectl_cmd | default('oc') }}"
    namespace: "{{ namespace | default('otel-demo') }}"
    target: "{{ target | default('cart') }}"
  tasks:
    - name: Restart deployment
      ansible.builtin.command: >
        {{ kubectl_cmd }} rollout restart deployment/{{ target }} -n {{ namespace }}
      register: restart_out
      changed_when: restart_out.rc == 0

    - name: Wait for rollout to complete
      ansible.builtin.command: >
        {{ kubectl_cmd }} rollout status deployment/{{ target }}
        -n {{ namespace }} --timeout=180s
      register: rollout_out
      changed_when: false
