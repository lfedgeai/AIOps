apiVersion: v1
kind: Service
metadata:
  name: edgelake-dashboard
  namespace: edgelake
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: http
    nodePort: 30080
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: edgelake-dashboard
  sessionAffinity: None
  type: NodePort
