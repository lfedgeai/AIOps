apiVersion: v1
kind: ConfigMap
metadata:
  name: edgelake-config
  namespace: edgelake
data:
  ANYLOG_BROKER_PORT: '32160'
  ANYLOG_PATH: /app
  ANYLOG_REST_PORT: '32159'
  ANYLOG_SERVER_PORT: '32158'
  AUTOCOMMIT: 'true'
  BLOBS_COMPRESS: 'true'
  BLOBS_REUSE: 'true'
  BLOBS_STORAGE: 'false'
  BLOCKCHAIN_DESTINATION: file
  BLOCKCHAIN_SOURCE: master
  BLOCKCHAIN_SYNC: 60 second
  BROKER_BIND: 'false'
  BROKER_THREADS: '6'
  CITY: ''
  CLUSTER_NAME: edge-us-cluster
  COMPANY_NAME: JPLab
  COMPRESS_FILE: 'true'
  COUNTRY: US
  DB_IP: 127.0.0.1
  DB_PORT: '5432'
  DB_TYPE: sqlite
  DEFAULT_DBMS: mydb
  DEPLOY_LOCAL_SCRIPT: 'false'
  DEPLOYMENTS_BRANCH: main
  DEPLOYMENTS_REPO: https://github.com/AnyLog-co/deployment-scripts
  DOCKER_MONITORING: 'false'
  ENABLE_HA: 'false'
  ENABLE_MQTT: 'false'
  ENABLE_OPCUA: 'false'
  ENABLE_REMOTE_GUI: 'false'
  ENABLE_VIDEO_STREAMING: 'false'
  INIT_TYPE: prod
  IS_HIDDEN: 'false'
  LOCAL_SCRIPTS: /app/deployment-scripts
  LOCATION: ''
  MEMORY: 'false'
  NODE_MONITORING: 'true'
  NODE_NAME: edgelake-rhel-edge-us
  NODE_TYPE: master-operator
  OPERATOR_THREADS: '3'
  QUERY_POOL: '6'
  REST_BIND: 'false'
  REST_THREADS: '6'
  REST_TIMEOUT: '30'
  START_DATE: '30'
  STATE: ''
  STORE_MONITORING: 'true'
  SYSLOG_MONITORING: 'false'
  SYSTEM_QUERY: 'true'
  SYSTEM_QUERY_DB: sqlite
  TCP_BIND: 'false'
  TCP_THREADS: '6'
  TEST_DIR: /app/deployment-scripts/test
  THRESHOLD_TIME: 60 seconds
  THRESHOLD_VOLUME: 10KB
  WRITE_IMMEDIATE: 'true'
