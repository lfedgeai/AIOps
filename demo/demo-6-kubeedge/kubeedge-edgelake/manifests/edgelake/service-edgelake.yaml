apiVersion: v1
kind: Service
metadata:
  name: edgelake
  namespace: edgelake
spec:
  ports:
  - name: server
    port: 32158
    protocol: TCP
    targetPort: 32158
  - name: rest
    port: 32159
    protocol: TCP
    targetPort: 32159
  - name: broker
    port: 32160
    protocol: TCP
    targetPort: 32160
  selector:
    app: edgelake
  sessionAffinity: None
  type: ClusterIP
