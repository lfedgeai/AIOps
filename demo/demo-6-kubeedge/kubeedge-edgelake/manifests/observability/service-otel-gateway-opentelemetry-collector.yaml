apiVersion: v1
kind: Service
metadata:
  name: otel-gateway-opentelemetry-collector
  namespace: observability
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: jaeger-compact
    nodePort: 30719
    port: 6831
    protocol: UDP
    targetPort: 6831
  - name: jaeger-grpc
    nodePort: 30663
    port: 14250
    protocol: TCP
    targetPort: 14250
  - name: jaeger-thrift
    nodePort: 31546
    port: 14268
    protocol: TCP
    targetPort: 14268
  - appProtocol: grpc
    name: otlp
    nodePort: 30317
    port: 4317
    protocol: TCP
    targetPort: 4317
  - name: otlp-http
    nodePort: 30318
    port: 4318
    protocol: TCP
    targetPort: 4318
  - name: prometheus
    nodePort: 32591
    port: 8889
    protocol: TCP
    targetPort: 8889
  - name: zipkin
    nodePort: 32602
    port: 9411
    protocol: TCP
    targetPort: 9411
  selector:
    app.kubernetes.io/instance: otel-gateway
    app.kubernetes.io/name: opentelemetry-collector
    component: standalone-collector
  sessionAffinity: None
  type: NodePort
