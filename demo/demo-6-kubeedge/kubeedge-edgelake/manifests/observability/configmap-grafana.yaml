apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  namespace: observability
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  isDefault: true\n\
    \  name: Prometheus\n  type: prometheus\n  url: http://prometheus-server.observability.svc.cluster.local\n"
  grafana.ini: '[analytics]

    check_for_updates = true

    [log]

    mode = console

    [paths]

    data = /var/lib/grafana/

    logs = /var/log/grafana

    plugins = /var/lib/grafana/plugins

    provisioning = /etc/grafana/provisioning

    [server]

    domain = ''''

    [unified_storage]

    index_path = /var/lib/grafana-search/bleve

    '
