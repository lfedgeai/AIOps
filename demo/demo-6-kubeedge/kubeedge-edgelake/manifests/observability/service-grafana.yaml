apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: service
    nodePort: 30090
    port: 80
    protocol: TCP
    targetPort: grafana
  selector:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/name: grafana
  sessionAffinity: None
  type: NodePort
