apiVersion: v1
kind: Service
metadata:
  name: prometheus-server
  namespace: observability
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: http
    nodePort: 30091
    port: 80
    protocol: TCP
    targetPort: 9090
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: prometheus
  sessionAffinity: None
  type: NodePort
