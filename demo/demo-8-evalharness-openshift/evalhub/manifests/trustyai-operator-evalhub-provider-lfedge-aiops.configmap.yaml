# EvalHub provider: runs one real AIOps harness cell per benchmark job.
# Applied to the RHOAI applications namespace so the TrustyAI operator reconciles it.
# The EvalHub CR must list `lfedge-aiops` under spec.providers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trustyai-service-operator-evalhub-provider-lfedge-aiops
  namespace: __RHOAI_APPLICATIONS_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: trustyai
    app.opendatahub.io/trustyai: "true"
    platform.opendatahub.io/part-of: trustyai
    trustyai.opendatahub.io/evalhub-provider-name: lfedge-aiops
    trustyai.opendatahub.io/evalhub-provider-type: system
data:
  lfedge_aiops.yaml: |
    id: lfedge_aiops
    name: LF Edge AIOps (MTTD/MTTR)
    description: >
      Runs the LF Edge AIOps harness against the OTEL Demo on the same cluster:
      injects a Kubernetes fault, polls the agent, and reports real
      mttd_seconds / mttr_seconds / RCA / remediation metrics.
    type: builtin
    runtime:
      k8s:
        image: __LFEDGE_EVALHUB_IMAGE__
        entrypoint:
          - python3
          - "-u"
          - /app/evalhub/lfedge_aiops_provider/main.py
        cpu_request: 250m
        memory_request: 512Mi
        cpu_limit: "2"
        memory_limit: 4Gi
        env:
          - name: CLICKHOUSE_HTTP
            value: __CLICKHOUSE_HTTP__
          - name: K8S_FAULT_NAMESPACE
            value: __OTEL_DEMO_NAMESPACE__
          - name: MLFLOW_TRACKING_URI
            value: __MLFLOW_TRACKING_URI__
          - name: LFEDGE_MLFLOW_URI
            value: __MLFLOW_TRACKING_URI__
          - name: MLFLOW_MODE
            value: external
          - name: CONTEXT_REPO_PATH
            value: /app/context/opentelemetry-demo
          - name: LFEDGE_MODEL_API_KEY
            value: "__LFEDGE_MODEL_API_KEY__"
    benchmarks:
      - id: mttd_mttr_harness
        name: MTTD / MTTR (real harness)
        description: >
          One harness cell. Select agent and context via parameters:
          agent: rhdp_deepseek-r1-distill-qwen-14b | rhdp_qwen3-14b |
            litemaas_qwen3.8-27b | rhdp_granite-3-2-8b-instruct |
            prelude_glm-53-flash
          context_c: 0 (no RAG) | 1 (source) | 2 (docs) | 3 (architecture) |
            4 (dependencies) | comma-separated e.g. "1,4"
          scenario: 0 | a | b | c
          fault: scale_zero | kill_pod | memory_limit | network_partition |
            readiness_probe_fail | config_corruption | dependency_removal |
            replica_overload | pvc_full | node_taint
          variant: target deployment name (default: cart)
          judge: true | false (oracle LLM judge)
        category: aiops
        metrics:
          - mttd_seconds
          - mttr_seconds
          - mttr_verified_seconds
          - detected
          - rca_correct
          - remediation_correct
          - remediation_executed
          - recovery_verified
          - llm_invoked
          - agent_error
        num_few_shot: 0
        dataset_size: 0
        tags:
          - lfedge
          - aiops
          - clickhouse
          - k8s
