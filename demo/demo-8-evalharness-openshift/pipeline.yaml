        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef reset_environment() -> str:\n    \"\"\"Reset the OTEL demo to\
          \ a clean baseline before the next harness cell.\n\n    Scales all fault-target\
          \ deployments back to 1 replica, removes any\n    leftover harness artifacts\
          \ (network policies, env vars), and waits\n    for pods to become Ready.\n\
          \    \"\"\"\n    import os\n    import time\n\n    from kubernetes import\
          \ client, config\n\n    config.load_incluster_config()\n    apps = client.AppsV1Api()\n\
          \    core = client.CoreV1Api()\n    net = client.NetworkingV1Api()\n\n \
          \   namespace = \"otel-demo\"\n    targets = [\"cart\", \"checkout\", \"\
          valkey-cart\", \"load-generator\",\n               \"product-catalog\",\
          \ \"payment\", \"email\", \"frontend\"]\n    issues = []\n\n    # Scale\
          \ all deployments back to at least 1 replica\n    for dep_name in targets:\n\
          \        try:\n            dep = apps.read_namespaced_deployment(dep_name,\
