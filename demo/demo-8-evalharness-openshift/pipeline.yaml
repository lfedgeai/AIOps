# PIPELINE DEFINITION
# Name: aiops-eval-matrix
# Description: AIOps harness: sequential agents × faults with environment reset and summary report
components:
  comp-exit-handler-1:
    dag:
      tasks:
        generate-report:
          cachingOptions: {}
          componentRef:
            name: comp-generate-report
          dependentTasks:
          - harness-cell
          - harness-cell-2
          - harness-cell-3
          - harness-cell-4
          inputs:
            parameters:
              result_1:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: harness-cell
              result_2:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: harness-cell-2
              result_3:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: harness-cell-3
              result_4:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: harness-cell-4
              run_name:
                runtimeValue:
                  constant: aiops-eval-matrix
          taskInfo:
            name: summary report
        harness-cell:
          cachingOptions: {}
          componentRef:
            name: comp-harness-cell
          dependentTasks:
          - reset-environment-2
          inputs:
            parameters:
              agent:
                runtimeValue:
                  constant: rhdp_deepseek-r1-distill-qwen-14b
              fault:
                runtimeValue:
                  constant: scale_zero
          taskInfo:
            name: rhdp_deeps / scale_zero
        harness-cell-2:
          cachingOptions: {}
          componentRef:
            name: comp-harness-cell-2
          dependentTasks:
          - reset-environment-3
          inputs:
            parameters:
              agent:
                runtimeValue:
                  constant: rhdp_deepseek-r1-distill-qwen-14b
              fault:
                runtimeValue:
                  constant: kill_pod
          taskInfo:
            name: rhdp_deeps / kill_pod
        harness-cell-3:
          cachingOptions: {}
          componentRef:
            name: comp-harness-cell-3
          dependentTasks:
          - reset-environment-4
          inputs:
            parameters:
              agent:
                runtimeValue:
                  constant: rhdp_granite-3-2-8b-instruct
              fault:
                runtimeValue:
                  constant: scale_zero
          taskInfo:
            name: rhdp_grani / scale_zero
        harness-cell-4:
          cachingOptions: {}
          componentRef:
            name: comp-harness-cell-4
          dependentTasks:
          - reset-environment-5
          inputs:
            parameters:
              agent:
                runtimeValue:
                  constant: rhdp_granite-3-2-8b-instruct
              fault:
                runtimeValue:
                  constant: kill_pod
          taskInfo:
            name: rhdp_grani / kill_pod
        preflight-models:
          cachingOptions: {}
          componentRef:
            name: comp-preflight-models
          taskInfo:
            name: preflight-models
        reset-environment-2:
          cachingOptions: {}
          componentRef:
            name: comp-reset-environment-2
          dependentTasks:
          - preflight-models
          taskInfo:
            name: reset / scale_zero
        reset-environment-3:
          cachingOptions: {}
          componentRef:
            name: comp-reset-environment-3
          dependentTasks:
          - harness-cell
          taskInfo:
            name: reset / kill_pod
        reset-environment-4:
          cachingOptions: {}
          componentRef:
            name: comp-reset-environment-4
          dependentTasks:
          - harness-cell-2
          taskInfo:
            name: reset / scale_zero
        reset-environment-5:
          cachingOptions: {}
          componentRef:
            name: comp-reset-environment-5
          dependentTasks:
          - harness-cell-3
          taskInfo:
            name: reset / kill_pod
  comp-generate-report:
    executorLabel: exec-generate-report
    inputDefinitions:
      parameters:
        result_1:
          parameterType: STRUCT
        result_2:
          parameterType: STRUCT
        result_3:
          parameterType: STRUCT
        result_4:
          parameterType: STRUCT
        run_name:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        report_artifact:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRUCT
  comp-harness-cell:
    executorLabel: exec-harness-cell
    inputDefinitions:
      parameters:
        agent:
          parameterType: STRING
        fault:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRUCT
  comp-harness-cell-2:
    executorLabel: exec-harness-cell-2
    inputDefinitions:
      parameters:
        agent:
          parameterType: STRING
        fault:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRUCT
  comp-harness-cell-3:
    executorLabel: exec-harness-cell-3
    inputDefinitions:
      parameters:
        agent:
          parameterType: STRING
        fault:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRUCT
  comp-harness-cell-4:
    executorLabel: exec-harness-cell-4
    inputDefinitions:
      parameters:
        agent:
          parameterType: STRING
        fault:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRUCT
  comp-preflight-models:
    executorLabel: exec-preflight-models
  comp-reset-environment:
    executorLabel: exec-reset-environment
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-reset-environment-2:
    executorLabel: exec-reset-environment-2
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-reset-environment-3:
    executorLabel: exec-reset-environment-3
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-reset-environment-4:
    executorLabel: exec-reset-environment-4
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-reset-environment-5:
    executorLabel: exec-reset-environment-5
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-generate-report:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_report
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_report(\n    result_1: dict,\n    result_2: dict,\n\
          \    result_3: dict,\n    result_4: dict,\n    run_name: str,\n    report_artifact:\
          \ dsl.Output[dsl.Artifact],\n) -> dict:\n    \"\"\"Aggregate all cell results\
          \ into a summary report.\n\n    Computes detection rate, mean MTTD, per-agent\
          \ breakdown, and logs\n    everything to MLflow as a summary run. Outputs\
          \ the report as a\n    pipeline artifact.\n    \"\"\"\n    import json\n\
          \    import os\n\n    import certifi\n    import mlflow\n    import tempfile\n\
          \n    sa_path = \"/var/run/secrets/kubernetes.io/serviceaccount\"\n    with\
          \ open(f\"{sa_path}/namespace\") as namespace_file:\n        workspace =\
          \ namespace_file.read().strip()\n    with open(f\"{sa_path}/token\") as\
          \ token_file:\n        os.environ[\"MLFLOW_TRACKING_TOKEN\"] = token_file.read().strip()\n\
          \    os.environ[\"MLFLOW_WORKSPACE\"] = workspace\n    os.environ[\"MLFLOW_TRACKING_URI\"\
          ] = \"https://mlflow.redhat-ods-applications.svc:8443/mlflow\"\n    with\
          \ tempfile.NamedTemporaryFile(mode=\"w\", delete=False) as bundle:\n   \
          \     for path in (certifi.where(), f\"{sa_path}/service-ca.crt\"):\n  \
          \          with open(path) as source:\n                bundle.write(source.read()\
          \ + \"\\n\")\n        os.environ[\"REQUESTS_CA_BUNDLE\"] = bundle.name\n\
          \    os.environ.pop(\"MLFLOW_TRACKING_INSECURE_TLS\", None)\n    os.environ.pop(\"\
          MLFLOW_RUN_ID\", None)\n    mlflow.set_tracking_uri(os.environ[\"MLFLOW_TRACKING_URI\"\
          ])\n    mlflow.set_workspace(workspace)\n\n    results = [result_1, result_2,\
          \ result_3, result_4]\n\n    total = len(results)\n    detected = sum(1\
          \ for r in results if r.get(\"detected\"))\n    mttds = [r.get(\"mttd_seconds\"\
          ) for r in results if r.get(\"mttd_seconds\") is not None]\n    mean_mttd\
          \ = sum(mttds) / len(mttds) if mttds else None\n    rca_correct = sum(1\
          \ for r in results if r.get(\"rca_correct\"))\n    remediation = sum(1 for\
          \ r in results if r.get(\"remediation_executed\"))\n    errors = sum(1 for\
          \ r in results if r.get(\"agent_error\"))\n\n    # Per-agent breakdown\n\
          \    by_agent = {}\n    for r in results:\n        agent = r.get(\"approach\"\
          , \"unknown\")\n        if agent not in by_agent:\n            by_agent[agent]\
          \ = {\"total\": 0, \"detected\": 0, \"mttds\": []}\n        by_agent[agent][\"\
          total\"] += 1\n        if r.get(\"detected\"):\n            by_agent[agent][\"\
          detected\"] += 1\n        if r.get(\"mttd_seconds\") is not None:\n    \
          \        by_agent[agent][\"mttds\"].append(r[\"mttd_seconds\"])\n\n    report\
          \ = {\n        \"run_name\": run_name,\n        \"total_cells\": total,\n\
          \        \"detected\": detected,\n        \"detection_rate\": round(detected\
          \ / total, 3) if total else 0,\n        \"mean_mttd_seconds\": round(mean_mttd,\
          \ 1) if mean_mttd is not None else None,\n        \"rca_correct\": rca_correct,\n\
          \        \"remediation_executed\": remediation,\n        \"agent_errors\"\
          : errors,\n        \"per_agent\": {\n            agent: {\n            \
          \    \"total\": v[\"total\"],\n                \"detected\": v[\"detected\"\
          ],\n                \"detection_rate\": round(v[\"detected\"] / v[\"total\"\
          ], 3),\n                \"mean_mttd_seconds\": round(sum(v[\"mttds\"]) /\
          \ len(v[\"mttds\"]), 1) if v[\"mttds\"] else None,\n            }\n    \
          \        for agent, v in by_agent.items()\n        },\n        \"cells\"\
          : [\n            {\n                \"agent\": r.get(\"approach\"),\n  \
          \              \"fault\": r.get(\"fault_flag\"),\n                \"detected\"\
          : r.get(\"detected\"),\n                \"mttd_seconds\": r.get(\"mttd_seconds\"\
          ),\n                \"rca_correct\": r.get(\"rca_correct\"),\n         \
          \       \"remediation_executed\": r.get(\"remediation_executed\"),\n   \
          \             \"agent_error\": r.get(\"agent_error\"),\n            }\n\
          \            for r in results\n        ],\n    }\n\n    # Log to MLflow\n\
          \    mlflow.set_experiment(\"agentic_aiops_mttd_mttr\")\n    with mlflow.start_run(run_name=f\"\
          {run_name}_summary\"):\n        mlflow.log_metric(\"total_cells\", total)\n\
          \        mlflow.log_metric(\"detected_count\", detected)\n        mlflow.log_metric(\"\
          detection_rate\", report[\"detection_rate\"])\n        if mean_mttd is not\
          \ None:\n            mlflow.log_metric(\"mean_mttd_seconds\", mean_mttd)\n\
          \        mlflow.log_metric(\"rca_correct_count\", rca_correct)\n       \
          \ mlflow.log_metric(\"remediation_executed_count\", remediation)\n     \
          \   mlflow.log_metric(\"agent_error_count\", errors)\n        mlflow.log_dict(report,\
          \ \"summary_report.json\")\n        mlflow.set_tag(\"run_type\", \"pipeline_summary\"\
          )\n        mlflow.set_tag(\"pipeline\", run_name)\n\n    # Write report\
          \ to file for pipeline artifact\n    with open(report_artifact.path, \"\
          w\") as f:\n        json.dump(report, f, indent=2)\n\n    print(json.dumps(report,\
          \ indent=2))\n    return report\n\n"
        image: image-registry.openshift-image-registry.svc:5000/agentic-aiops-harness/aiops-harness:latest
    exec-harness-cell:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - harness_cell
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef harness_cell(agent: str, fault: str) -> dict:\n    \"\"\"Run\
          \ one harness cell: inject fault, poll agent, score, output JSON.\"\"\"\n\
          \    import base64\n    import json\n    import os\n    import subprocess\n\
          \    import sys\n\n    # Load MaaS credentials from the Kubernetes Secret\n\
          \    from kubernetes import client, config\n\n    config.load_incluster_config()\n\
          \    v1 = client.CoreV1Api()\n    ns = open(\"/var/run/secrets/kubernetes.io/serviceaccount/namespace\"\
          ).read().strip()\n    secret = v1.read_namespaced_secret(\"aiops-model-credentials\"\
          , ns)\n    for key, value in (secret.data or {}).items():\n        os.environ[key]\
          \ = base64.b64decode(value).decode()\n\n    # Configure harness connections\n\
          \    os.environ[\"CLICKHOUSE_HTTP\"] = \"http://clickhouse.agentic-aiops-harness.svc.cluster.local:8123\"\
          \n    import certifi\n    import mlflow\n    import tempfile\n\n    sa_path\
          \ = \"/var/run/secrets/kubernetes.io/serviceaccount\"\n    os.environ[\"\
          MLFLOW_TRACKING_URI\"] = \"https://mlflow.redhat-ods-applications.svc:8443/mlflow\"\
          \n    os.environ[\"MLFLOW_WORKSPACE\"] = ns\n    with open(f\"{sa_path}/token\"\
          ) as token_file:\n        os.environ[\"MLFLOW_TRACKING_TOKEN\"] = token_file.read().strip()\n\
          \    # Keep the public CA roots as well as the OpenShift service CA for\
          \ MaaS.\n    with tempfile.NamedTemporaryFile(mode=\"w\", delete=False)\
          \ as bundle:\n        for path in (certifi.where(), f\"{sa_path}/service-ca.crt\"\
          ):\n            with open(path) as source:\n                bundle.write(source.read()\
          \ + \"\\n\")\n        os.environ[\"REQUESTS_CA_BUNDLE\"] = bundle.name\n\
          \    os.environ.pop(\"MLFLOW_TRACKING_INSECURE_TLS\", None)\n    os.environ.pop(\"\
          MLFLOW_RUN_ID\", None)\n    mlflow.set_tracking_uri(os.environ[\"MLFLOW_TRACKING_URI\"\
          ])\n    mlflow.set_workspace(ns)\n    mlflow.set_experiment(\"agentic_aiops_mttd_mttr\"\
          )\n    os.environ[\"K8S_FAULT_NAMESPACE\"] = \"otel-demo\"\n    os.environ[\"\
          K8S_NAMESPACE\"] = \"otel-demo\"\n    os.environ[\"PYTHONPATH\"] = \"/app\"\
          \n    os.environ[\"AGENT_TIMEOUT\"] = \"600\"\n\n    # Do not inject a fault\
          \ unless the selected model can answer requests.\n    subprocess.run(\n\
          \        [sys.executable, \"/app/scripts/preflight_agent_apis.py\", \"--agents\"\
          , agent, \"--require-all\"],\n        check=True, cwd=\"/app\", timeout=150,\n\
          \    )\n\n    cmd = [\n        sys.executable, \"-u\", \"/app/code/harness/run_harness.py\"\
          ,\n        \"--scenario\", \"a\",\n        \"--flag\", fault,\n        \"\
          --variant\", \"cart\",\n        \"--context-c\", \"0\",\n        \"--agents\"\
          , agent,\n        \"--no-judge\",\n        \"--detection-timeout\", \"600\"\
          ,\n        \"--fault-duration\", \"120\",\n        \"--output\", \"/tmp/result.json\"\
          ,\n    ]\n    proc = subprocess.run(cmd, capture_output=True, text=True,\
          \ timeout=900, cwd=\"/app\")\n    print(proc.stdout[-5000:])\n    if proc.returncode\
          \ != 0:\n        print(proc.stderr[-3000:], file=sys.stderr)\n        raise\
          \ RuntimeError(f\"Harness failed with exit code {proc.returncode}\")\n \
          \   if \"[harness] MLflow log error:\" in proc.stdout or \"[harness] MLflow\
          \ start_run error:\" in proc.stdout:\n        raise RuntimeError(\"Harness\
          \ did not log to MLflow; see the step log\")\n    with open(\"/tmp/result.json\"\
          ) as f:\n        result = json.load(f)\n    if result.get(\"approach\")\
          \ != agent or result.get(\"fault_flag\") != fault:\n        raise RuntimeError(\"\
          Harness returned a result for the wrong cell\")\n\n    from mlflow.tracking\
          \ import MlflowClient\n    experiment = mlflow.get_experiment_by_name(\"\
          agentic_aiops_mttd_mttr\")\n    expected_name = f\"{result['run_id']}_{agent}_scenarioa_{fault}_cart\"\
          \n    runs = MlflowClient().search_runs(\n        [experiment.experiment_id],\
          \ filter_string=f\"attributes.run_name = '{expected_name}'\",\n        order_by=[\"\
          start_time DESC\"], max_results=1,\n    )\n    if not runs or \"detected\"\
          \ not in runs[0].data.metrics:\n        raise RuntimeError(\"Harness metrics\
          \ were not found in RHOAI MLflow\")\n    if runs[0].data.tags.get(\"aiops.prompt_registry_status\"\
          ) != \"ok\":\n        raise RuntimeError(\"Agent prompts were not registered\
          \ in RHOAI MLflow; see the agent trace artifacts\")\n    if not any(item.path\
          \ == \"harness_run.json\" for item in MlflowClient().list_artifacts(runs[0].info.run_id)):\n\
          \        raise RuntimeError(\"Harness result artifact was not found in RHOAI\
          \ MLflow\")\n\n    # Large agent transcripts in KFP parameters broke report\
          \ deserialization.\n    # The full result and transcript remain in the MLflow\
          \ run artifacts.\n    keys = (\"run_id\", \"approach\", \"fault_flag\",\
          \ \"detected\", \"mttd_seconds\",\n            \"rca_correct\", \"remediation_executed\"\
          )\n    compact = {key: result.get(key) for key in keys}\n    compact[\"\
          agent_error\"] = bool(result.get(\"agent_error\"))\n    return compact\n\
          \n"
        image: image-registry.openshift-image-registry.svc:5000/agentic-aiops-harness/aiops-harness:latest
