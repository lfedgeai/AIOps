deploymentSpec:
  executors:
    exec-generate-report:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_report
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_report(\n    results: list[dict],\n    run_name: str,\n\
          ) -> dict:\n    \"\"\"Aggregate all cell results into a summary report.\n\
          \n    Computes detection rate, mean MTTD, per-agent breakdown, and logs\n\
          \    everything to MLflow as a summary run. Outputs the report as a\n  \
          \  pipeline artifact.\n    \"\"\"\n    import json\n    import os\n\n  \
          \  # MLflow logging\n    os.environ[\"MLFLOW_TRACKING_URI\"] = \"http://mlflow.agentic-aiops-harness.svc.cluster.local:5000\"\
          \n\n    total = len(results)\n    detected = sum(1 for r in results if r.get(\"\
          detected\"))\n    mttds = [r.get(\"mttd_seconds\") for r in results if r.get(\"\
          mttd_seconds\") is not None]\n    mean_mttd = sum(mttds) / len(mttds) if\
          \ mttds else None\n    rca_correct = sum(1 for r in results if r.get(\"\
          rca_correct\"))\n    remediation = sum(1 for r in results if r.get(\"remediation_executed\"\
          ))\n    errors = sum(1 for r in results if r.get(\"agent_error\"))\n\n \
          \   # Per-agent breakdown\n    by_agent = {}\n    for r in results:\n  \
          \      agent = r.get(\"approach\", \"unknown\")\n        if agent not in\
          \ by_agent:\n            by_agent[agent] = {\"total\": 0, \"detected\":\
          \ 0, \"mttds\": []}\n        by_agent[agent][\"total\"] += 1\n        if\
          \ r.get(\"detected\"):\n            by_agent[agent][\"detected\"] += 1\n\
          \        if r.get(\"mttd_seconds\") is not None:\n            by_agent[agent][\"\
          mttds\"].append(r[\"mttd_seconds\"])\n\n    report = {\n        \"run_name\"\
          : run_name,\n        \"total_cells\": total,\n        \"detected\": detected,\n\
          \        \"detection_rate\": round(detected / total, 3) if total else 0,\n\
          \        \"mean_mttd_seconds\": round(mean_mttd, 1) if mean_mttd else None,\n\
          \        \"rca_correct\": rca_correct,\n        \"remediation_executed\"\
          : remediation,\n        \"agent_errors\": errors,\n        \"per_agent\"\
          : {\n            agent: {\n                \"total\": v[\"total\"],\n  \
          \              \"detected\": v[\"detected\"],\n                \"detection_rate\"\
          : round(v[\"detected\"] / v[\"total\"], 3),\n                \"mean_mttd_seconds\"\
          : round(sum(v[\"mttds\"]) / len(v[\"mttds\"]), 1) if v[\"mttds\"] else None,\n\
          \            }\n            for agent, v in by_agent.items()\n        },\n\
          \        \"cells\": [\n            {\n                \"agent\": r.get(\"\
          approach\"),\n                \"fault\": r.get(\"fault_flag\"),\n      \
          \          \"detected\": r.get(\"detected\"),\n                \"mttd_seconds\"\
          : r.get(\"mttd_seconds\"),\n                \"rca_correct\": r.get(\"rca_correct\"\
          ),\n                \"remediation_executed\": r.get(\"remediation_executed\"\
          ),\n                \"agent_error\": r.get(\"agent_error\"),\n         \
          \   }\n            for r in results\n        ],\n    }\n\n    # Log to MLflow\n\
          \    try:\n        import mlflow\n\n        mlflow.set_tracking_uri(os.environ[\"\
          MLFLOW_TRACKING_URI\"])\n        mlflow.set_experiment(\"agentic_aiops_mttd_mttr\"\
          )\n        with mlflow.start_run(run_name=f\"{run_name}_summary\"):\n  \
          \          mlflow.log_metric(\"total_cells\", total)\n            mlflow.log_metric(\"\
          detected_count\", detected)\n            mlflow.log_metric(\"detection_rate\"\
          , report[\"detection_rate\"])\n            if mean_mttd:\n             \
          \   mlflow.log_metric(\"mean_mttd_seconds\", mean_mttd)\n            mlflow.log_metric(\"\
          rca_correct_count\", rca_correct)\n            mlflow.log_metric(\"remediation_executed_count\"\
          , remediation)\n            mlflow.log_metric(\"agent_error_count\", errors)\n\
          \            mlflow.log_dict(report, \"artifacts/summary_report.json\")\n\
          \            mlflow.set_tag(\"run_type\", \"pipeline_summary\")\n      \
          \      mlflow.set_tag(\"pipeline\", run_name)\n    except Exception as e:\n\
          \        print(f\"[report] MLflow logging failed: {e}\")\n\n    # Write\
          \ report to file for pipeline artifact\n    with open(\"/tmp/report.json\"\
          , \"w\") as f:\n        json.dump(report, f, indent=2)\n\n    print(json.dumps(report,\
          \ indent=2))\n    return report\n\n"
        image: image-registry.openshift-image-registry.svc:5000/agentic-aiops-harness/aiops-harness:latest
    exec-harness-cell:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - harness_cell
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef harness_cell(agent: str, fault: str) -> dict:\n    \"\"\"Run\
          \ one harness cell: inject fault, poll agent, score, output JSON.\"\"\"\n\
          \    import base64\n    import json\n    import os\n    import subprocess\n\
          \    import sys\n\n    # Load MaaS credentials from the Kubernetes Secret\n\
          \    from kubernetes import client, config\n\n    config.load_incluster_config()\n\
          \    v1 = client.CoreV1Api()\n    ns = open(\"/var/run/secrets/kubernetes.io/serviceaccount/namespace\"\
          ).read().strip()\n    secret = v1.read_namespaced_secret(\"aiops-model-credentials\"\
          , ns)\n    for key, value in (secret.data or {}).items():\n        os.environ[key]\
          \ = base64.b64decode(value).decode()\n\n    # Configure harness connections\n\
          \    os.environ[\"CLICKHOUSE_HTTP\"] = \"http://clickhouse.agentic-aiops-harness.svc.cluster.local:8123\"\
          \n    os.environ[\"MLFLOW_TRACKING_URI\"] = \"http://mlflow.agentic-aiops-harness.svc.cluster.local:5000\"\
          \n    os.environ[\"K8S_FAULT_NAMESPACE\"] = \"otel-demo\"\n    os.environ[\"\
          K8S_NAMESPACE\"] = \"otel-demo\"\n    os.environ[\"PYTHONPATH\"] = \"/app\"\
          \n    os.environ[\"AGENT_TIMEOUT\"] = \"600\"\n\n    cmd = [\n        sys.executable,\
          \ \"-u\", \"/app/code/harness/run_harness.py\",\n        \"--scenario\"\
          , \"a\",\n        \"--flag\", fault,\n        \"--variant\", \"cart\",\n\
          \        \"--context-c\", \"0\",\n        \"--agents\", agent,\n       \
          \ \"--no-judge\",\n        \"--detection-timeout\", \"600\",\n        \"\
          --fault-duration\", \"120\",\n        \"--output\", \"/tmp/result.json\"\
          ,\n    ]\n    proc = subprocess.run(cmd, capture_output=True, text=True,\
          \ timeout=900, cwd=\"/app\")\n    print(proc.stdout[-5000:])\n    if proc.returncode\
          \ != 0:\n        print(proc.stderr[-3000:], file=sys.stderr)\n    try:\n\
          \        with open(\"/tmp/result.json\") as f:\n            return json.load(f)\n\
          \    except FileNotFoundError:\n        return {\"error\": \"no output\"\
          , \"detected\": False, \"mttd_seconds\": None,\n                \"approach\"\
          : agent, \"fault_flag\": fault}\n\n"
        image: image-registry.openshift-image-registry.svc:5000/agentic-aiops-harness/aiops-harness:latest
