pipelineInfo:
  description: "AIOps harness: sequential agents \xD7 faults with environment reset\
    \ and summary report"
  name: aiops-eval-matrix
root:
  dag:
    tasks:
      generate-report:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-report
        dependentTasks:
        - harness-cell
        - harness-cell-2
        - harness-cell-3
        - harness-cell-4
        inputs:
          parameters:
            pipelinechannel--harness-cell-2-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: harness-cell-2
            pipelinechannel--harness-cell-3-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: harness-cell-3
            pipelinechannel--harness-cell-4-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: harness-cell-4
            pipelinechannel--harness-cell-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: harness-cell
            results:
              runtimeValue:
                constant:
                - '{{$.inputs.parameters[''pipelinechannel--harness-cell-Output'']}}'
                - '{{$.inputs.parameters[''pipelinechannel--harness-cell-2-Output'']}}'
                - '{{$.inputs.parameters[''pipelinechannel--harness-cell-3-Output'']}}'
                - '{{$.inputs.parameters[''pipelinechannel--harness-cell-4-Output'']}}'
            run_name:
              runtimeValue:
                constant: aiops-eval-matrix
        taskInfo:
          name: summary report
      harness-cell:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-harness-cell
        dependentTasks:
        - reset-environment
        inputs:
          parameters:
            agent:
              runtimeValue:
                constant: rhdp_deepseek-r1-distill-qwen-14b
            fault:
              runtimeValue:
                constant: scale_zero
        taskInfo:
          name: rhdp_deeps / scale_zero
      harness-cell-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-harness-cell-2
        dependentTasks:
        - reset-environment-2
        inputs:
          parameters:
            agent:
              runtimeValue:
                constant: rhdp_deepseek-r1-distill-qwen-14b
            fault:
              runtimeValue:
                constant: kill_pod
        taskInfo:
          name: rhdp_deeps / kill_pod
      harness-cell-3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-harness-cell-3
        dependentTasks:
        - reset-environment-3
        inputs:
          parameters:
            agent:
              runtimeValue:
                constant: rhdp_granite-3-2-8b-instruct
            fault:
              runtimeValue:
                constant: scale_zero
        taskInfo:
          name: rhdp_grani / scale_zero
      harness-cell-4:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-harness-cell-4
        dependentTasks:
        - reset-environment-4
        inputs:
          parameters:
            agent:
              runtimeValue:
                constant: rhdp_granite-3-2-8b-instruct
            fault:
              runtimeValue:
                constant: kill_pod
        taskInfo:
          name: rhdp_grani / kill_pod
      reset-environment:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-reset-environment
        taskInfo:
          name: reset / scale_zero
      reset-environment-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-reset-environment-2
        dependentTasks:
        - harness-cell
        taskInfo:
          name: reset / kill_pod
      reset-environment-3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-reset-environment-3
        dependentTasks:
        - harness-cell-2
        taskInfo:
          name: reset / scale_zero
      reset-environment-4:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-reset-environment-4
        dependentTasks:
        - harness-cell-3
        taskInfo:
          name: reset / kill_pod
