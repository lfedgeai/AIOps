  comp-reset-environment-2:
    executorLabel: exec-reset-environment-2
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-reset-environment-3:
    executorLabel: exec-reset-environment-3
    outputDefinitions:
