# PIPELINE DEFINITION
# Name: aiops-eval-matrix
# Description: AIOps harness: sequential agents × faults with environment reset and summary report
components:
  comp-generate-report:
    executorLabel: exec-generate-report
    inputDefinitions:
      parameters:
        results:
          parameterType: LIST
        run_name:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRUCT
  comp-harness-cell:
    executorLabel: exec-harness-cell
    inputDefinitions:
      parameters:
        agent:
          parameterType: STRING
        fault:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRUCT
  comp-harness-cell-2:
    executorLabel: exec-harness-cell-2
    inputDefinitions:
      parameters:
        agent:
          parameterType: STRING
        fault:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRUCT
