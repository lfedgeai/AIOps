                constant: rhdp_deepseek-r1-distill-qwen-14b
            fault:
              runtimeValue:
                constant: kill_pod
        taskInfo:
          name: rhdp_deeps / kill_pod
      harness-cell-3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-harness-cell-3
        inputs:
          parameters:
            agent:
              runtimeValue:
                constant: rhdp_granite-3-2-8b-instruct
            fault:
              runtimeValue:
                constant: scale_zero
        taskInfo:
          name: rhdp_grani / scale_zero
