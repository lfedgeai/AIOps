        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-harness-cell
        inputs:
          parameters:
            agent:
              runtimeValue:
                constant: rhdp_deepseek-r1-distill-qwen-14b
            fault:
              runtimeValue:
                constant: scale_zero
        taskInfo:
          name: rhdp_deeps / scale_zero
      harness-cell-2:
        cachingOptions:
          enableCache: true
        componentRef:
