deploymentSpec:
  executors:
    exec-harness-cell:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - harness_cell
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef harness_cell(agent: str, fault: str) -> dict:\n    import base64,\
          \ json, os, subprocess, sys\n\n    # Load MaaS credentials from the Kubernetes\
          \ Secret\n    from kubernetes import client, config\n    config.load_incluster_config()\n\
          \    v1 = client.CoreV1Api()\n    ns = open(\"/var/run/secrets/kubernetes.io/serviceaccount/namespace\"\
          ).read().strip()\n    secret = v1.read_namespaced_secret(\"aiops-model-credentials\"\
          , ns)\n    for key, value in (secret.data or {}).items():\n        os.environ[key]\
          \ = base64.b64decode(value).decode()\n\n    # Configure harness connections\n\
          \    os.environ[\"CLICKHOUSE_HTTP\"] = \"http://clickhouse.agentic-aiops-harness.svc.cluster.local:8123\"\
          \n    os.environ[\"MLFLOW_TRACKING_URI\"] = \"http://mlflow.agentic-aiops-harness.svc.cluster.local:5000\"\
          \n    os.environ[\"K8S_FAULT_NAMESPACE\"] = \"otel-demo\"\n    os.environ[\"\
          K8S_NAMESPACE\"] = \"otel-demo\"\n    os.environ[\"PYTHONPATH\"] = \"/app\"\
          \n    os.environ[\"AGENT_TIMEOUT\"] = \"600\"\n    os.environ[\"DETECTION_WINDOW\"\
          ] = \"700\"\n\n    cmd = [\n        sys.executable, \"-u\", \"/app/code/harness/run_harness.py\"\
          ,\n        \"--scenario\", \"a\",\n        \"--flag\", fault,\n        \"\
          --variant\", \"cart\",\n        \"--context-c\", \"0\",\n        \"--agents\"\
          , agent,\n        \"--no-judge\",\n        \"--detection-timeout\", \"600\"\
          ,\n        \"--fault-duration\", \"120\",\n        \"--output\", \"/tmp/result.json\"\
          ,\n    ]\n    proc = subprocess.run(cmd, capture_output=True, text=True,\
          \ timeout=900, cwd=\"/app\")\n    print(proc.stdout[-3000:])\n    if proc.returncode\
          \ != 0:\n        print(proc.stderr[-3000:], file=sys.stderr)\n    try:\n\
          \        with open(\"/tmp/result.json\") as f:\n            return json.load(f)\n\
          \    except FileNotFoundError:\n        return {\"error\": \"no output file\"\
          , \"detected\": False, \"mttd_seconds\": None}\n\n"
        image: image-registry.openshift-image-registry.svc:5000/agentic-aiops-harness/aiops-harness:latest
