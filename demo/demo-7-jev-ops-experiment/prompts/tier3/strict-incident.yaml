# Hand-written candidate variant (jev-prompt-variants task 6.2, 2026-11-01), from
# docs/prompt-variants-dev-notes.md. Never edit in place: bump `version` or add a variant.
# v2 (2026-11-01): changed after the task 6.3 review, before any record used v1.
# v3 (2026-11-01): changed after the second task 6.3 review, before any record used v2.
name: strict-incident
version: 3
tier: tier3
style: policy
rationale: 'Policy stated. Only the incident question changes. Dev notes finding 1: false alarms come
  from failures that had already recovered while their errors were still inside the observation window.
  This asks about the end of the window and says a recovered failure is not an incident now. The latency
  clause ("much slower ... well beyond the normal variation") and the noise clause ("small or noisy
  changes with no errors") are shared with the Tier 2 variant, so a latency-only fault may be missed.
  Risk: the end-of-window wording pushes toward "no" where requests look fine but the cluster is not,
  such as a lost node whose services have moved (K009) or a stuck rollout with no errors (K005), both
  expected incidents. v2 named those two cases in the "yes" text, which the second review judged fitted
  to the catalogue; v3 replaces them with one general clause, "part of the application or cluster is not
  in its normal working state". Tier 4 uses it too; on Tier 4 records, a removed false alarm shows as
  censored on replay.'
dev_records:
- results/tier3/10.3-combined
questions:
  incident_detected:
    instructions: At the end of the observation window, is there an operational incident in this application
      or cluster?
    criteria:
      'true': 'Yes: at the end of the window something is still wrong. Users'' requests fail or are much
        slower than in the baseline window, well beyond the normal variation, or part of the application
        or cluster is not in its normal working state.'
      'false': 'No: the application or cluster works normally at the end of the window. A failure that
        has already recovered is not an incident now. Small or noisy changes with no errors are not an
        incident.'
  affected_component:
    instructions: Which single service or node is the origin of the problem?
    criteria:
      none: Nothing is affected.
    criteria_templates:
      services: The problem originates in {option}.
      nodes: The problem originates in node {option}.
  diagnosis:
    instructions: What is the most likely failure mode?
    criteria:
      none: Nothing is wrong.
      service_unavailable: A service has no running instances or cannot serve at all.
      pod_restart: A service's instances were restarted or replaced.
      oom_killed: Instances are killed for running out of memory.
      network_blocked: Network traffic to or from a service is blocked.
      readiness_failure: Instances run but are not ready to receive traffic.
      misconfiguration: A service is running with wrong configuration.
      node_eviction: Workloads were evicted from a node.
      disk_full: A disk or filesystem is full.
      overload: A service receives more load than it can handle.
      application_failure: The service itself is returning errors.
      unknown: The evidence is too weak or conflicting to name a failure mode.
  recommended_action:
    instructions: What single operational action should be taken now?
    criteria:
      no_action: Take no action. Keep watching.
      investigate: Look into the cause before changing anything.
      restart_service: Restart the affected service.
      scale_up: Add capacity or restore the replica count of the affected service.
      rollback_change: Roll back a recent change or configuration.
      escalate: Hand the incident to a human on-call engineer immediately.
