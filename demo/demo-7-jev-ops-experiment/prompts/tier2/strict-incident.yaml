# Hand-written candidate variant (jev-prompt-variants task 6.2, 2026-11-01), from
# docs/prompt-variants-dev-notes.md. Never edit in place: bump `version` or add a variant.
name: strict-incident
version: 1
tier: tier2
style: policy
rationale: 'Policy stated. Only the incident question changes. Dev notes findings 1 and 2: "right now"
  is read as "anywhere in the window", and latency noise with no errors is called an incident. This asks
  about the end of the window, says a recovered failure is not an incident now, and asks for latency changes
  beyond normal variation. Risk: a real latency-only fault may be missed.'
dev_records:
- results/tier2/20261012-190447-369b
questions:
  incident_detected:
    instructions: At the end of the observation window, is there an operational incident in this application?
    criteria:
      'true': 'Yes: at the end of the window something is still failing. Requests are failing, a service
        or component is unavailable, or requests are much slower than in the baseline window, well beyond
        the normal variation between windows.'
      'false': 'No: the application works normally at the end of the window. A failure that has already
        recovered is not an incident now. Small or noisy changes with no errors are not an incident.'
  affected_service:
    instructions: Which single service or component is the origin of the problem?
    criteria:
      none: No service is affected.
    criteria_templates:
      services: The problem originates in {option}.
  diagnosis:
    instructions: What is the most likely failure mode?
    criteria:
      none: Nothing is wrong.
      application_failure: The service itself is returning errors.
      latency_degradation: Requests succeed but are much slower than normal.
      dependency_unreachable: A service cannot reach something it depends on.
      database_contention: A database or data store is slow or locked.
      resource_exhaustion: CPU, memory or capacity is running out.
      unknown: The evidence is too weak or conflicting to name a failure mode.
  recommended_action:
    instructions: What single operational action should be taken now?
    criteria:
      no_action: Take no action. Keep watching.
      investigate: Look into the cause before changing anything.
      restart_service: Restart the affected service.
      rollback_change: Roll back a recent change or configuration.
      scale_up: Add capacity to the affected service.
      escalate: Hand the incident to a human on-call engineer immediately.
