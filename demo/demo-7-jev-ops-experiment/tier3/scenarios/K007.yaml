experiment_id: K007
application: otel-demo-3.1.0-kind
description: valkey-cart scaled to zero replicas
rationale: >
  cart's backing store has no pods. The origin is valkey-cart, not cart, which tests whether
  the engine follows the dependency. Measured on kind (2026-10-14): cart does not fail fast,
  it hangs, so user requests time out (over 10 s) from the first poll while error rates stay
  near zero; the valkey-cart row shows 0/0 at once, frontend p95 latency rises to about 3.6 s
  from about 105 s, and cart's own error rate reaches 100% only at about 165 s. Restoring
  replicas or undoing the change fixes it.
fault:
  type: dependency_removal
  target: valkey-cart
target_component: valkey-cart
duration_s: 240
detection_window_s: 240
poll_interval_s: 15
observation_window_s: 180
baseline_window_s: 180
workload:
  users: 10
expected:
  incident: true
  affected_component: valkey-cart
  diagnosis: service_unavailable
  acceptable_actions: [scale_up, rollback_change, investigate, escalate]
