apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus-openclaw-otel
  labels:
    app.kubernetes.io/part-of: netobserv-platform-merge
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: Network AIOps demo
    type: prometheus
    access: proxy
    uid: prometheus-openclaw-otel
    url: http://openclaw-otel-prometheus.openclaw.svc:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
