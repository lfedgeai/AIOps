# Public static assets (no OAuth redirect) — Control UI lobster logo, favicon.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openclaw-ui-static
  namespace: openclaw
  labels:
    app.kubernetes.io/part-of: netobserv-platform-merge
spec:
  parentRefs:
    - name: openclaw-gateway
      namespace: openclaw
  hostnames:
    - PLACEHOLDER_OPENCLAW_RHCL_HOST
  rules:
    - matches:
        - path:
            type: Exact
            value: /apple-touch-icon.png
        - path:
            type: Exact
            value: /favicon.ico
      backendRefs:
        - name: openclaw
          port: 18789
