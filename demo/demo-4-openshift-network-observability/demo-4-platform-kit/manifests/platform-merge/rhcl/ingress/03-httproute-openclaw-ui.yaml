# UI traffic — explicit paths only (must NOT match /auth/callback; Envoy rejects PCRE lookahead).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openclaw-ui
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/part-of: netobserv-platform-merge
spec:
  parentRefs:
    - name: openclaw-gateway
      namespace: openclaw
  hostnames:
    - PLACEHOLDER_OPENCLAW_RHCL_HOST
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /new
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /ws
        - path:
            type: PathPrefix
            value: /health
        - path:
            type: PathPrefix
            value: /assets
        - path:
            type: PathPrefix
            value: /static
        - path:
            type: PathPrefix
            value: /dist
      backendRefs:
        - name: openclaw
          port: 18789
