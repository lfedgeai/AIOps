apiVersion: apps/v1
kind: Deployment
metadata:
  name: netobserv-grafana-bridge
  namespace: openclaw
  labels:
    app.kubernetes.io/name: netobserv-grafana-bridge
    app.kubernetes.io/part-of: netobserv-platform-merge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netobserv-grafana-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netobserv-grafana-bridge
    spec:
      serviceAccountName: netobserv-grafana-bridge
      imagePullSecrets:
        - name: redhat-io-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: spiffe-helper-init
          image: SPIFFE_HELPER_IMAGE_PLACEHOLDER
          args:
            - "-config"
            - /etc/spiffe-helper/helper.conf
            - "-daemon-mode=false"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spiffe-svid
              mountPath: /spiffe/svid
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
      containers:
        - name: bridge
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              python3 -m pip install -q 'mlflow>=3.1,<4'
              export MLFLOW_TRACING_PATH=/tracing
              exec python3 /scripts/netobserv-grafana-bridge.py
          env:
            - name: MLFLOW_TRACING_PATH
              value: /tracing
            - name: MLFLOW_TRACE_CONTEXT_TTL_SEC
              value: "3600"
            - name: SPIFFE_MTLS
              value: "1"
            - name: OPENCLAW_HOOKS_URL
              value: https://openclaw-hooks-mtls.openclaw.svc.cluster.local:18790/hooks/agent
            - name: SLACK_CHANNEL_ID
              value: "SLACK_CHANNEL_ID_PLACEHOLDER"
            - name: LISTEN_PORT
              value: "8080"
            - name: SPIFFE_CERT_DIR
              value: /spiffe/svid
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: mlflow-tracing
              mountPath: /tracing
              readOnly: true
            - name: spiffe-svid
              mountPath: /spiffe/svid
              readOnly: true
        - name: spiffe-helper
          image: SPIFFE_HELPER_IMAGE_PLACEHOLDER
          args:
            - "-config"
            - /etc/spiffe-helper/helper.conf
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spiffe-svid
              mountPath: /spiffe/svid
            - name: spiffe-helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: netobserv-grafana-bridge-scripts
        - name: mlflow-tracing
          configMap:
            name: netobserv-mlflow-tracing
            optional: true
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: spiffe-svid
          emptyDir:
            medium: Memory
        - name: spiffe-helper-config
          configMap:
            name: netobserv-grafana-bridge-spiffe-helper
---
apiVersion: v1
kind: Service
metadata:
  name: netobserv-grafana-bridge
  namespace: openclaw
  labels:
    app.kubernetes.io/name: netobserv-grafana-bridge
spec:
  selector:
    app.kubernetes.io/name: netobserv-grafana-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
