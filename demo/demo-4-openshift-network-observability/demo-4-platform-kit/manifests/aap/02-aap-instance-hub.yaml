# AnsibleAutomationPlatform with Hub enabled (needs RWX storage class).
# Apply via: AAP_MINIMAL=0 AAP_STORAGE_CLASS=<rwx-sc> ./scripts/install-aap.sh install
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: netobserv-aap
  namespace: ansible-automation-platform
  labels:
    app.kubernetes.io/part-of: netobserv-aap
spec:
  image_pull_policy: IfNotPresent
  controller:
    disabled: false
  eda:
    disabled: true
  hub:
    disabled: false
    storage_type: file
    file_storage_storage_class: REPLACE_RWX_STORAGE_CLASS
    file_storage_size: 10Gi
  lightspeed:
    disabled: true
