apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-otel-collector
  labels:
    app.kubernetes.io/name: openclaw-otel-collector
    app.kubernetes.io/part-of: netobserv-platform-merge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.120.0
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: prom-export
              containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: openclaw-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-otel-collector
  labels:
    app.kubernetes.io/name: openclaw-otel-collector
    app.kubernetes.io/part-of: netobserv-platform-merge
spec:
  selector:
    app.kubernetes.io/name: openclaw-otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prom-export
      port: 8889
      targetPort: prom-export
