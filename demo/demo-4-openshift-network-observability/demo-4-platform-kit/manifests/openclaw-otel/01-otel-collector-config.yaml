apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-otel-collector-config
  labels:
    app.kubernetes.io/name: openclaw-otel-collector
    app.kubernetes.io/part-of: netobserv-platform-merge
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: openclaw
        send_timestamps: true
        metric_expiration: 30m
        resource_to_telemetry_conversion:
          enabled: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
