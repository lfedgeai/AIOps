# In-cluster NetObserv / OpenShift MCP server for OpenClaw.
# Gateway connects via Streamable HTTP (sandbox never dials :6443).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netobserv-mcp
  namespace: openclaw
  labels:
    app.kubernetes.io/name: netobserv-mcp
    app.kubernetes.io/part-of: netobserv-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netobserv-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netobserv-mcp
        app.kubernetes.io/part-of: netobserv-demo
    spec:
      serviceAccountName: openclaw-netobserv
      containers:
        - name: mcp
          image: registry.access.redhat.com/ubi9/python-312:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NETOBSERV_IN_CLUSTER
              value: "1"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8080"
            - name: HOME
              value: /tmp
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.openclaw.svc.cluster.local:5000"
            - name: MLFLOW_EXPERIMENT_NAME
              value: "openclaw-netobserv"
            - name: MLFLOW_TRACE_CONTEXT_URL
              value: "http://netobserv-grafana-bridge.openclaw.svc.cluster.local:8080/mlflow/trace-context"
          workingDir: /opt/mcp
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              # UBI python image already has an active venv; do not use --user
              python3 -m pip install -q -r /opt/mcp/requirements.txt
              exec python3 /opt/mcp/server.py
          volumeMounts:
            - name: mcp-scripts
              mountPath: /opt/mcp
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: mcp-scripts
          configMap:
            name: netobserv-mcp-scripts
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: netobserv-mcp
  namespace: openclaw
  labels:
    app.kubernetes.io/name: netobserv-mcp
    app.kubernetes.io/part-of: netobserv-demo
spec:
  selector:
    app.kubernetes.io/name: netobserv-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
