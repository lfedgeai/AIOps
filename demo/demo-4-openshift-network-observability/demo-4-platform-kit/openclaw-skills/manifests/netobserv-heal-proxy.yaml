# In-cluster heal/probe HTTP proxy for OpenShell sandboxes.
# OpenShell SSRF blocks :6443 and cannot complete tunnels to kubernetes.default.svc,
# so the sandbox calls this Service on :8080 instead of the Kubernetes API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netobserv-heal-proxy
  namespace: openclaw
  labels:
    app.kubernetes.io/name: netobserv-heal-proxy
    app.kubernetes.io/part-of: netobserv-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netobserv-heal-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netobserv-heal-proxy
        app.kubernetes.io/part-of: netobserv-demo
    spec:
      serviceAccountName: openclaw-netobserv
      containers:
        - name: proxy
          image: registry.access.redhat.com/ubi9/python-312:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NETOBSERV_IN_CLUSTER
              value: "1"
            - name: HOME
              value: /tmp
          workingDir: /opt/heal
          command: ["python3", "/opt/heal/netobserv-heal-proxy.py"]
          volumeMounts:
            - name: heal-scripts
              mountPath: /opt/heal
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: heal-scripts
          configMap:
            name: netobserv-heal-proxy-scripts
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: netobserv-heal-proxy
  namespace: openclaw
  labels:
    app.kubernetes.io/name: netobserv-heal-proxy
    app.kubernetes.io/part-of: netobserv-demo
spec:
  selector:
    app.kubernetes.io/name: netobserv-heal-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
