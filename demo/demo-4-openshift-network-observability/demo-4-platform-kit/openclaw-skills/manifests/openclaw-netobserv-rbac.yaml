# Limited RBAC for OpenClaw NetObserv heal/probe (lab only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-netobserv
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw-netobserv
    app.kubernetes.io/part-of: netobserv-demo
---
# Read-only platform health (ClusterOperators + Nodes) for openshift_cluster_health MCP tool
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-netobserv-platform-read
  labels:
    app.kubernetes.io/name: openclaw-netobserv
rules:
  - apiGroups: ["config.openshift.io"]
    resources: ["clusteroperators", "clusterversions"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-netobserv-platform-read
  labels:
    app.kubernetes.io/name: openclaw-netobserv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openclaw-netobserv-platform-read
subjects:
  - kind: ServiceAccount
    name: openclaw-netobserv
    namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-netobserv-default
  namespace: default
  labels:
    app.kubernetes.io/name: openclaw-netobserv
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-netobserv-default
  namespace: default
  labels:
    app.kubernetes.io/name: openclaw-netobserv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-netobserv-default
subjects:
  - kind: ServiceAccount
    name: openclaw-netobserv
    namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-netobserv-probe
  namespace: todo-client
  labels:
    app.kubernetes.io/name: openclaw-netobserv
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-netobserv-probe
  namespace: todo-client
  labels:
    app.kubernetes.io/name: openclaw-netobserv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-netobserv-probe
subjects:
  - kind: ServiceAccount
    name: openclaw-netobserv
    namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-netobserv-app
  namespace: todo-demo
  labels:
    app.kubernetes.io/name: openclaw-netobserv
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-netobserv-app
  namespace: todo-demo
  labels:
    app.kubernetes.io/name: openclaw-netobserv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-netobserv-app
subjects:
  - kind: ServiceAccount
    name: openclaw-netobserv
    namespace: openclaw
