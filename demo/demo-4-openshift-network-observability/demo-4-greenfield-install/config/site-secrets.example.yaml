# Greenfield site secrets — copy to site-secrets.local.yaml and fill in.
#
#   cp config/site-secrets.example.yaml config/site-secrets.local.yaml
#   chmod 600 config/site-secrets.local.yaml
#
# Or run the interactive wizard (writes the same file):
#   ./scripts/greenfield-install.sh config prompt
#
# NEVER commit site-secrets.local.yaml (gitignored).

site:
  name: "my-greenfield-site"
  slack_channel_id: ""          # required for phases slack, event, spiffe (C…)

aws:
  region: ""                    # e.g. ap-southeast-1
  s3_bucket: ""                 # Loki backend bucket
  access_key_id: ""
  secret_access_key: ""

llm:
  provider: litemaas            # litemaas | vllm | maas-16k | openai
  base_url: ""                  # https://host/v1
  model_id: ""                  # e.g. Qwen3.6-35B-A3B
  api_key: ""
  policy_host: ""               # hostname only (OpenShell network policy)
  context_window: 131072
  max_tokens: 12288
  enable_thinking: true

slack:
  bot_token: ""                 # xoxb-…
  app_token: ""                 # xapp-…

aap:
  license_file: ""              # ignored by greenfield — use AAP Gateway UI (Phase 6)

openshift:
  storage_class: gp3-csi
  openclaw_namespace: openclaw
  openshell_namespace: openshell
